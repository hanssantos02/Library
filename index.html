<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Library</title>
  <link rel="stylesheet" href="styles.css">
  <script src="javascript.js" defer></script>
</head>
<body>

  <header>
    <h1>My Library</h1>
  </header>

  <main id="library-container" class="library-container">
    
  </main>

  <div id="overlay" class="overlay hidden">
    <div id="modal" class="modal">
      <button id="close-modal-btn" class="close-btn" type="button">&times;</button>
      <h2>Add a New Book</h2>

      <form id="new-book-form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>

        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>

        <label for="pages">Pages</label>
        <input type="number" id="pages" name="pages" min="1" required>

        <label class="checkbox-label">
          <input type="checkbox" id="isRead" name="isRead">
          Already read
        </label>

        <button type="submit" class="submit-btn">Add Book</button>
      </form>
    </div>
  </div>

</body>
</html>
